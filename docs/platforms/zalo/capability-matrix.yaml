platform: zalo
researched_at: 2026-08-01
baseline_commit: private-source-checkpoint-omitted
decision: BLOCKED_PENDING_OFFICIAL_VERIFICATION
operator_verification_gate:
  spec: SPEC-014
  status: BLOCKED
  operator_live_verification: false
  notes: "Phase 1 preparation completed without credentialed or external activity; no capability evidence was promoted."
target_surface: "Potential Zalo OA direct assistant and OA-managed GMF only; excludes ordinary personal/friend groups."
blockers:
  - id: GMF_SEMANTICS_UNVERIFIED
    severity: blocking
    notes: Public official evidence does not establish GMF membership, group messaging, member-role, or parity semantics.
  - id: OA_AUTH_AND_WEBHOOK_DETAILS_UNVERIFIED
    severity: blocking
    notes: Token lifecycle and webhook delivery semantics require a dedicated test OA/app.
open_questions:
  - id: OQ-001
    question: Can an OA join an existing ordinary private Zalo friend group through supported public APIs?
    evidence: not_documented
  - id: OQ-002
    question: Can GMF provide inbound/outbound group text with stable IDs and admin/member operations?
    evidence: requires_live_verification
  - id: OQ-003
    question: Which OA package, review, and verification state enables the required APIs?
    evidence: requires_live_verification
